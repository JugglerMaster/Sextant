[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sextant"
version = "0.8.7"
description = "Self-hosted fleet operations console with cross-platform agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Christopher Juggler", email = "christopherjuggler@gmail.com" }]
keywords = ["remote-administration", "fleet-management", "self-hosted", "fastapi", "linux", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
  "Topic :: System :: Networking",
]
dependencies = [
  "fastapi>=0.162.2,<0.163",
  "starlette>=1.10,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ldap = [
  "ldap3>=2.9,<3",
]
windows-remote = [
  "pywinrm>=0.5,<1",
]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<0.28",
  "pyflakes>=3,<5",
  "pip-audit>=2,<3",
  "ldap3>=2.9,<3",
]

[project.urls]
Homepage = "https://github.com/JugglerMaster/Sextant"
Repository = "https://github.com/JugglerMaster/Sextant"
Issues = "https://github.com/JugglerMaster/Sextant/issues"
Changelog = "https://github.com/JugglerMaster/Sextant/blob/main/CHANGELOG.md"

[project.scripts]
sextant = "sextant_control.cli:main"
sextant-agent = "sextant_agent.cli:main"

[tool.setuptools.packages.find]
include = ["sextant_common*", "sextant_control*", "sextant_agent*"]

[tool.setuptools.package-data]
sextant_control = ["static/*", "windows_install.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
